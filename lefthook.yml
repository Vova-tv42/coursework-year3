glob_matcher: doublestar

pre-commit:
  jobs:
    - name: web lint
      root: web/
      glob: "web/**/*.{js,jsx,ts,tsx}"
      run: bun x oxlint --fix {staged_files}
      stage_fixed: true

    - name: web format
      root: web/
      glob: "web/**/*"
      run: bun x oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: go format
      glob: "**/*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
